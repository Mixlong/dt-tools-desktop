name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DT-Tools ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Rewrite latest.json URLs to OSS
        shell: bash
        run: |
          OSS_BASE="https://bikewise.oss-cn-shenzhen.aliyuncs.com/d-space/dt-tools-desktop"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          find "$BUNDLE_DIR" -name "latest.json" | while read -r jsonFile; do
            echo "Rewriting URLs in: $jsonFile"
            node -e "
              const fs = require('fs')
              const data = JSON.parse(fs.readFileSync('$jsonFile', 'utf8'))
              const ossBase = '$OSS_BASE/${{ matrix.target }}'
              for (const platform of Object.keys(data.platforms || {})) {
                const entry = data.platforms[platform]
                if (entry.url) {
                  const filename = entry.url.split('/').pop()
                  const newUrl = ossBase + '/' + filename
                  console.log('  ' + platform + ': ' + entry.url + ' -> ' + newUrl)
                  entry.url = newUrl
                }
              }
              fs.writeFileSync('$jsonFile', JSON.stringify(data, null, 2), 'utf8')
            "
          done

      - name: Install ossutil (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$(uname -m)" = "arm64" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-mac-arm64.zip
          elif [ "$RUNNER_OS" = "macOS" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-mac-amd64.zip
          fi
          unzip -o ossutil.zip
          # ossutil v1 binary may be named ossutil, ossutil64, or ossutil-v1.7.18-*
          OSS_BIN=$(find . -maxdepth 2 -type f -name "ossutil*" ! -name "*.zip" ! -name "*.md" | head -1)
          cp "$OSS_BIN" ossutil-bin
          chmod +x ossutil-bin

      - name: Install ossutil (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64.zip" -OutFile "ossutil64.zip"
          Expand-Archive -Path "ossutil64.zip" -DestinationPath "."
          Get-ChildItem -Recurse -Path "." | Where-Object { $_.Name -eq "ossutil64.exe" } | Select-Object -First 1 | ForEach-Object { $_.FullName } > ossutil_path.txt

      - name: Upload to OSS (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          OSS_BUCKET="bikewise"
          OSS_PREFIX="d-space/dt-tools-desktop/${{ matrix.target }}"

          echo "Uploading macOS bundle from: $BUNDLE_DIR"
          echo "Target OSS path: $OSS_BUCKET/$OSS_PREFIX"

          # Upload dmg files
          find "$BUNDLE_DIR" -name "*.dmg" | while read -r file; do
            echo "Uploading: $file"
            ./ossutil-bin cp "$file" "oss://$OSS_BUCKET/$OSS_PREFIX/" -f -e oss-cn-shenzhen.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          done

          # Upload latest.json (updater artifact)
          find "$BUNDLE_DIR" -name "latest.json" | while read -r file; do
            echo "Updating: $file"
            ./ossutil-bin cp "$file" "oss://$OSS_BUCKET/$OSS_PREFIX/" -f -e oss-cn-shenzhen.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          done
        shell: bash

      - name: Upload to OSS (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          $region = $env:OSS_REGION
          if (-not $region) { $region = "cn-shenzhen" }
          $ossutil = Get-Content ossutil_path.txt | Select-Object -First 1
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $exe = Get-ChildItem -Path $bundleDir -Recurse | Where-Object { $_.Extension -in @(".exe", ".msi") } | Select-Object -First 1
          $latest = Get-ChildItem -Path $bundleDir -Recurse -Filter latest.json | Select-Object -First 1
          $ossPrefix = "d-space/dt-tools-desktop/${{ matrix.target }}"

          Write-Host "Uploading Windows bundle from: $bundleDir"

          if ($exe) {
            & $ossutil --region $region cp $exe.FullName "oss://$($env:OSS_BUCKET)/$ossPrefix/" -f -e $env:OSS_ENDPOINT -i $env:OSS_ACCESS_KEY_ID -k $env:OSS_ACCESS_KEY_SECRET
          }

          if ($latest) {
            & $ossutil --region $region cp $latest.FullName "oss://$($env:OSS_BUCKET)/$ossPrefix/latest.json" -f -e $env:OSS_ENDPOINT -i $env:OSS_ACCESS_KEY_ID -k $env:OSS_ACCESS_KEY_SECRET
          }
