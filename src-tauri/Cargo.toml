[package]
name = "dt_tools_desktop"
version = "0.1.0"
description = "DT-Tools desktop app"
authors = ["Digiwise"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dt_tools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
serialport = "4.7.2"
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
