[package]
name = "dt_tools_desktop"
version = "0.1.2"
description = "DT-Tools desktop app"
authors = ["Digiwise"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dt_tools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serialport = "4.7.2"
tauri = { version = "2.10.0", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView"] }
